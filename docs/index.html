<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logins</title>
    <link rel="stylesheet" href="Estilos/style_login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,1,0" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/akar-icons-fonts"></script>
</head>

<body>
    <div class="card">
        <ul class="card-nav">
            <li>
                <img class="logo" src="imagens/logoB.png" />
                <span class="active-bar"></span>
            </li>
            <li>
                <button type="button" class="signin active" onclick="selectView('signin')">
                    <i class="ai-person-check"></i>
                    <span>Entrar</span>
                </button>
            </li>
            <li>
                <button type="button" class="signup" onclick="selectView('signup')">
                    <i class="ai-person-add"></i>
                    <span>Cadastrar</span>
                </button>
            </li>
        </ul>
        <div class="card-hero">
            <div class="card-hero-inner">
                <div class="card-hero-content signin">
                    <div>
                        <h2>Bem-vindo de volta!!!</h2>
                        <h3>Insira suas credenciais.</h3>
                    </div>
                    <img src="imagens/img-login.png" />
                </div>
                <div class="card-hero-content signup">
                    <div>
                        <h2>Cadastro.</h2>
                        <h3>Cadastre-se para continuar.</h3>
                    </div>
                    <img src="imagens/img-cadastro2.png" />
                </div>
            </div>
        </div>
        <div class="card-form">
            <div class="forms">


                <form id="signin" class="active">
                    <p>Não tem uma conta? <a>Cadastrar</a>.</p>
                    <label> Email </label>
                    <div class="control">
                        <input type="text" id="login-mail" autocomplete="off" placeholder="seuemail@gmail.com" />
                        <i class="ai-envelope"></i>
                    </div>
                    <label> Senha </label>
                    <div class="control">
                        <input type="password" id="login-senha" placeholder="●●●●●●●●●●●●●●●" />
                        <i class="ai-lock-on"></i>
                    </div>
                    <p class="footer">
                        Clique em entrar para acessar a próxima página...
                    </p>
                    <button>Entrar</button>
                </form>


                <form id="signup">
                    <p>Já tem uma conta? <a>Entrar</a>.</p>
                    <label> Nome </label>
                    <div class="control">
                        <input type="text" id="cad-nome" placeholder="Seu nome" />
                        <i class="ai-person"></i>
                    </div>
                    <label> Email </label>
                    <div class="control">
                        <input type="text" id="cad-mail" autocomplete="off" placeholder="seuemail@gmail.com" />
                        <i class="ai-envelope"></i>
                    </div>
                    <label> Senha </label>
                    <div class="control">
                        <input type="password" id="cad-senha" placeholder="●●●●●●●●●●●●●●●" />
                        <i class="ai-lock-on"></i>
                    </div>
                    <button>Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="Codigos/main.js"></script>
</body>

</html>
